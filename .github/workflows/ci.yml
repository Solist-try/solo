# CI for the Go Solo Vite/React app (+ optional Express health API)

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile found — running npm ci"
            npm ci
          else
            echo "No lockfile found — running npm install"
            npm install
          fi

      - name: Typecheck, lint, test, and build
        run: npm run check

      - name: Start web app (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run build
          npm run preview &
          sleep 3
          curl -sf http://127.0.0.1:4173 >/dev/null
          echo "Web preview responded on :4173"

      - name: Start API health check (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm run start:api &
          sleep 2
          curl -sf http://127.0.0.1:3000/health
          echo
          echo "API health endpoint responded on :3000"
