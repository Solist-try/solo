# This is a workflow that sets up Node, installs dependencies, builds, tests, and can start the app manually

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Set up Node.js (LTS). Change node-version if you need a different version.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies (uses package-lock.json/ npm ci for consistent installs)
      - name: Install dependencies
        run: npm ci

      # Build (if a build script exists, --if-present prevents failure if absent)
      - name: Build
        run: npm run build --if-present

      # Run tests (if a test script is defined)
      - name: Run tests
        run: npm test --if-present

      # For manual runs: start the app. This runs only when you trigger the workflow manually.
      # It tries npm start, falls back to node index.js, and prints a message if neither exists.
      - name: Start app (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm start --if-present || node index.js || echo "No start command found. Update this step to run your app."

      # Helpful quick output step
      - name: Done
        run: echo "Node workflow completed"
